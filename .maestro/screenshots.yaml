# Снимает кадры основных экранов клиента для страницы в App Store.
#
# Здесь намеренно нет assertVisible: цель — получить кадры, а не проверить
# приложение. Одна несовпавшая подпись обрывала бы весь проход и не оставляла
# ни одного снимка. Проверки живут в остальных сценариях этого каталога.
#
# Вход выполняется демо-аккаунтом по паролю: регистрация требует кода из
# письма, который в CI получить неоткуда.
#
# Переходы делаются нажатием на видимый текст, а не по вкладкам: подписи у
# вкладок отключены, и попасть в иконку координатами получается не всегда.
#
# Подписи обёрнуты в .*: Maestro сравнивает text с целой строкой доступности
# элемента, а карточка категории склеивает заголовок с перечнем услуг под ним,
# поэтому точное совпадение по заголовку ничего не находит.

appId: com.adiya.serviceapp
---
- launchApp:
    clearState: true
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: shots/01-onboarding

- tapOn:
    text: "Далее"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: shots/02-onboarding-2

- tapOn:
    text: "Далее"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: shots/03-onboarding-3

- tapOn:
    text: "Пропустить|Начать|Поехали"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: shots/04-login

- tapOn:
    id: "email-input"
    optional: true
- inputText: "adiyakudaibergenova8@gmail.com"
- tapOn:
    id: "password-input"
    optional: true
- inputText: "TaptymTest2026"
- hideKeyboard

- tapOn:
    text: "Войти"
    optional: true

# Системный запрос на уведомления приходит сразу после входа и может быть
# на любом из языков раннера.
- tapOn:
    text: "Allow|Разрешить|OK"
    optional: true

- waitForAnimationToEnd:
    timeout: 20000

# iOS предлагает сохранить пароль в связке ключей и накрывает этим диалогом
# весь экран. Появляется он уже после входа, поэтому закрываем здесь, а не
# сразу после нажатия «Войти».
- tapOn:
    text: "Not Now|Не сейчас"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: shots/05-home

- tapOn:
    text: ".*Красота и здоровье.*"
    optional: true
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: shots/06-subcategories

- tapOn:
    text: ".*(Мастера маникюра|Визажисты|Массажисты).*"
    optional: true
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: shots/07-results

- tapOn:
    text: ".*Демо Специалист.*"
    optional: true
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: shots/08-specialist

- back
- back
- back
- waitForAnimationToEnd:
    timeout: 8000

- tapOn:
    text: ".*Заведения.*"
    optional: true
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: shots/09-venues

- tapOn:
    text: ".*АЛАКОЛЬ 2026.*"
    optional: true
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: shots/10-alakol
- back
- waitForAnimationToEnd:
    timeout: 5000

# Вкладки «Брони», «Сообщения» и лента у демо-аккаунта пустые, для витрины
# они не годятся, поэтому сценарий на них не заходит.
